[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "sessionformer"
version = "0.1.0"
description = "From-scratch transformer sequential recommender with entropy-gated reranking"
requires-python = ">=3.12"

[tool.setuptools.packages.find]
include = ["sessionformer*"]
